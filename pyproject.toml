[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdas"
version = "0.1.0"
description = "Multi-Dimensional Analysis System for English text"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "spacy>=3.8,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "nltk>=3.8,<4",
    "langdetect>=1.0.9,<2",
    "jinja2-fragments>=0.2,<1",
]

[project.optional-dependencies]
# Training dependencies (not needed for production inference)
training = [
    "sentence-transformers>=3.0",
    "streamlit>=1.62.0",
    "plotly>=7.0.0",
]
stanza = ["stanza>=1.8,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
