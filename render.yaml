services:
  - type: web
    name: mdas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn mdas.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONPATH
        value: "src"
      - key: MDAS_V2
        value: "true"
      - key: MDAS_TIMEOUT
        value: "30"
